# Horae Zone, the nooutco account service (plan: sass-assistant docs/ios-plan.md §3).
#
# INGRESS. `workers_dev = false` and no route: until the owner's first deploy
# this Worker has no public URL. The route for horae-zone.nooutco.me (with its
# WAF skip rule for the device routes, ruling D-22) is added at that deploy, on
# the owner's word. test/config.test.mjs fails if a route appears here first.
#
# SECRETS are never in this file. The deploy script (bin/deploy.mjs, plan §4,
# DEPLOY.md) sets them with `wrangler secret put`, each value on stdin:
# HZ_ACCOUNT_KEY (generated; the PIN pepper, ticket key and sealing keys
# derive from it), RESEND_KEY (hidden prompt), HZ_MAIL_FROM, HZ_ALERT_TO,
# HZ_LINK_BASE, HZ_REOPEN_BASE, HZ_RESET_BASE and HZ_TURNSTILE_SECRET (hidden prompt). HZ_CODES_PER_DAY, the mail plan's daily limit, goes in the
# deploy-only config when the plan's limit is not the default 3000, and so does
# HZ_TURNSTILE_SITEKEY (public). Until both Turnstile keys are set, POST /account
# and an unsigned POST /signin answer not-configured (src/turnstile.js).

name = "horae-zone"
main = "src/index.js"
compatibility_date = "2026-09-01"

workers_dev = false

# The hourly purge of spent and expired nonces and of audit rows past their
# 6-year retention (src/retention.js RETENTION; test/purge.test.mjs keeps the
# two in step). A cron trigger opens no URL.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "horae-zone"
# The deploy script creates the database and writes its id into the
# gitignored wrangler.deploy.toml, never here. Local dev
# (`wrangler dev --local`) uses an on-disk sqlite file and ignores the id.
database_id = "00000000-0000-0000-0000-000000000000"
