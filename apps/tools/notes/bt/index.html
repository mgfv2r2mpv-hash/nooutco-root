<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BT Notes</title>
  <!-- Served from this project, not unpkg. These three ARE the page: if any of
       them fails to arrive, a technician gets a nav bar and an empty white
       rectangle, with no error and nothing to do about it. That is not a
       theoretical failure - a full parallel test run reproduced it, with React
       loading and @babel/standalone silently not. Versions are pinned here
       rather than floating on @18 / @7, so the page cannot change under us
       because someone else published. See apps/tools/vendor/. -->
  <script src="/vendor/react-18.3.1.production.min.js"></script>
  <script src="/vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="/vendor/babel-standalone-7.29.8.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="/assets/notes-gate.js"></script>
  <script src="/assets/notes-scrub.js"></script>
  <!-- The assistant pill owns the bottom-right corner on this page, so the
       report lives inside the assistant panel instead of behind a second
       floating circle on the same spot. See error-button.js. -->
  <script>window.ERROR_BUTTON_INLINE = true;</script>
  <script src="/assets/error-button.js" defer></script>
  <!-- Unified shared chrome - tokens before nav-bar.css so its variables resolve. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/assets/nav-bar.css">
  <!-- Shared note-page chrome - the same file the BCBA page uses. -->
  <link rel="stylesheet" href="../notes-page.css">
  <script src="/assets/nav-bar.js" defer></script>
</head>
<body>
  <noaba-bar product="tools" crumbs="Notes/BT session note" crumb-hrefs="/notes/"></noaba-bar>
  <div id="root"></div>
  <!-- Gear ↔ NotesGate bridge. Visual unification only; the gate's auth logic is
       untouched. Gear opens login when logged out, logs out when logged in; the
       bar reflects login state. -->
  <script>
    (function () {
      function authed() { return !!(window.NotesGate && window.NotesGate.isLoggedIn()); }
      window.__noabaAuthProbe = authed;
      function emit() {
        document.dispatchEvent(new CustomEvent("noaba:auth-state", { detail: { authed: authed() } }));
      }
      document.addEventListener("noaba:admin-invoke", function () {
        if (!window.NotesGate) return;
        if (window.NotesGate.isLoggedIn()) window.NotesGate.logout();
        else window.NotesGate.openLogin();
      });
      if (window.NotesGate && window.NotesGate.subscribe) window.NotesGate.subscribe(emit);
      emit();
    })();
  </script>

  <!-- Shared helpers used by the tool configs (plain JS, loaded before them) -->
  <script>
    window.NOTE_TOOLS = [];
    window.NoteToolsUtil = {
      // "a" | "b" | "c" menu string for ALLOWED-value lists in prompts.
      menu: function (arr) { return arr.map(function (x) { return '"' + x + '"'; }).join(" | "); },
      // Validate the model's hint codes against the tool's catalog and the note's
      // known section keys; anything unrecognized is dropped (fabrication-proof).
      normalizeHints: function (raw, catalog, validSections) {
        if (!Array.isArray(raw)) return [];
        return raw.filter(function (h) {
          return h && typeof h.section === "string" && typeof h.code === "string" &&
            validSections.indexOf(h.section) !== -1 &&
            Object.prototype.hasOwnProperty.call(catalog, h.code);
        }).map(function (h) {
          return { section: h.section, code: h.code, detail: typeof h.detail === "string" ? h.detail.slice(0, 120) : "" };
        }).slice(0, 8);
      },
    };
  </script>

  <!-- One tool on this page. The engine hides its ribbon when only one is
       registered, so /notes/bt/ stays a single-purpose page while sharing every
       behaviour - conversation, prompt cache, scrub gate, hints, drafts - with
       the BCBA tools. -->
  <script src="../bcba/tools/bt.js"></script>

  <!-- Word-level diff for the inline revision view (plain JS). -->
  <script src="../bcba/diff.js"></script>
  <script src="../bcba/style-features.js"></script>

  <!-- Assistant panel, then the engine that mounts it. Order matters: Babel
       standalone runs these in document order and the engine renders the panel. -->
  <script type="text/babel" src="../bcba/revision-panel.jsx"></script>
  <script type="text/babel" src="../bcba/engine.jsx"></script>
</body>
</html>
