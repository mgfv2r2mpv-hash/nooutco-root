name: Games E2E Tests

# The suite grew from ~135 tests to ~485 per browser. Run as one job that was
# 1455 serial tests against a SINGLE `wrangler pages dev` process for ~50
# minutes, and workerd did not survive it - it logged
#   kj/async-io-unix.c++:186: disconnected: ::write(...): Connection reset by peer
# and everything after failed with "Could not connect to localhost: Connection
# refused". One crashed server surfaced as 405 test failures, which reads like a
# broken product and is not one: the same tree was 482/485 locally, and exactly
# one of those 405 was a real assertion.
#
# Sharding by browser gives each project its own short-lived server: ~485 tests
# and roughly a third of the wall clock per job, three fresh workerds instead of
# one that has to survive the entire run. `aggregate` keeps a single stable
# check name so branch protection needn't know how many shards there are.

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/games/**'
      - '.github/workflows/games-test.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/games/**'
      - '.github/workflows/games-test.yml'

defaults:
  run:
    working-directory: apps/games

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E (${{ matrix.project }})
    timeout-minutes: 35
    strategy:
      # One browser failing must not cancel the other two - knowing whether a
      # failure is browser-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/games/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only the browser this shard actually needs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run E2E tests
        # GAMES_TEST_PORT is what disables `reuseExistingServer`, so this job
        # always starts its own wrangler rather than adopting whatever else
        # might answer on the port. Shards run on separate runners so they
        # cannot actually collide, but that guard is worth keeping armed.
        env:
          GAMES_TEST_PORT: 8788
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact v4 rejects duplicate names across matrix jobs.
          name: playwright-report-${{ matrix.project }}
          path: apps/games/playwright-report/
          retention-days: 14

  aggregate:
    # One stable check name regardless of how the matrix is shaped.
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Report shard results
        working-directory: .
        run: |
          echo "shard result: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] || {
            echo "::error::One or more browser shards failed - see the E2E (<browser>) jobs."
            exit 1
          }
