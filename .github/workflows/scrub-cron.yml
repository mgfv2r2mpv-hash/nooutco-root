name: scrub-learning-nightly

# Cloudflare Pages cannot run cron triggers, so the nightly PHI scrub-learning run is
# fired from here. It POSTs to /api/admin/scrub-run, authenticated with CRON_SECRET
# (set as both a Cloudflare Worker secret and a GitHub repo secret). The run only
# PROPOSES stopwords for human review - it never changes detection on its own.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 3am EDT
  workflow_dispatch: {} # manual "Run workflow" button for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # The step used to be `curl -fsS` and nothing else, so the run's answer went
      # straight to /dev/null. That mattered more than it looks: the endpoint returned
      # a bare {"ok":true} on every run from June to August while writing nothing, and
      # this job went green every one of those nights. The endpoint reports counts now,
      # so the counts go in the log and in the job summary where they can be read
      # without opening an inbox.
      - name: Trigger scrub-learning run
        run: |
          code=$(curl -sS -o report.json -w '%{http_code}' \
            -X POST https://tools.nooutco.me/api/admin/scrub-run \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat report.json; echo
          {
            echo '### Scrub learning run'
            echo
            echo '```json'
            cat report.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A run that stopped early fails the job rather than reporting success.
          test "$code" = "200"
