name: Profile API Tests

# apps/profile-api decides what a technician's learned style card says, and
# enforces the claim that the store cannot hold clinical text. Both are things
# a refactor could quietly break, so they get CI from the day the code lands
# rather than after the first time it matters.
#
# No install step and no matrix: the tests are plain `node --test` over two
# pure modules with zero dependencies, which is deliberate - this repo has no
# build step and the profile Worker does not introduce one.

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/profile-api/**'
      - '.github/workflows/profile-api-test.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/profile-api/**'
      - '.github/workflows/profile-api-test.yml'

defaults:
  run:
    working-directory: apps/profile-api

jobs:
  unit:
    name: Profile API Tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the other workflows use: `node --test` only learned
          # to expand a glob pattern itself in 22. On 20 the quoted glob is
          # passed through literally and the run fails with "Could not find
          # test/*.test.js" - which is how this was caught.
          node-version: '22'

      # Run the runner directly rather than `npm ci` first: there is no
      # lockfile because there are no dependencies, and `npm ci` fails without
      # one. If a dependency is ever added, this needs a lockfile and an install
      # step, not a looser command.
      # --test-concurrency=1 is not optional, and it is why this line is not a
      # bare `node --test`. Two of these files are live tests: each brings up
      # its own `wrangler dev` against the SAME local D1 directory. Run in
      # parallel they contend for it, and the failure does not look like
      # contention - routes come back without their fields, so the assertions
      # read as "Cannot read properties of undefined" and "the supervisor still
      # sees the rule". Locally the same race shows up as five silently SKIPPED
      # tests and a green run, which is worse. package.json's test script has
      # carried the flag for exactly this reason; this line had drifted from it.
      - name: Run unit tests
        run: node --test --test-concurrency=1 "test/*.test.js"
