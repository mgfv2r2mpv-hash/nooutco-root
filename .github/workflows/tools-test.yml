name: Tools E2E Tests

# Mirrors games-test.yml. It exists because apps/tools had no CI at all: the
# suite was written, committed and shipped to production without ever running on
# a push. That was found while promoting dev to main - three commits' worth of
# SAP note-drafter work (structured output, malformed-JSON recovery, the admin
# ?schema=off toggle) reached production having only ever been run by hand.
#
# Note this suite is CDN-dependent in a way the games one is not - the note
# pages pull React and Babel from a CDN and compile JSX in the browser, which is
# why playwright.config.js caps workers at 2 and sets a 90s timeout. A CDN
# hiccup can therefore fail this workflow without anything being wrong with the
# code; check the failure before believing it.
#
# ── ONE JOB PER SHARD ──────────────────────────────────────────────────────
#
# This file used to run three shards one after another inside a single job per
# browser, and its own comment named the fix: "The move that buys wall clock is
# project x shard as parallel jobs, which is a rewrite of this file rather than
# a number, and is the thing to do when 70 runs out." It ran out on 2026-09-26,
# when webkit was the last check standing on a PR that was otherwise green and
# ready, at roughly 55 minutes a browser: three shards at 20.8, 15.2 and 19.6.
#
# PARALLEL SHARDS. Each (project, shard) is now its own job, so the wall clock
# for the whole suite is the SLOWEST SINGLE SHARD rather than the sum of three.
# Roughly 20 minutes instead of 55, for the same tests on the same runners.
#
# It also helps the server problem, though it does not solve it. `wrangler pages
# dev` leaks per request - measured on the runner 2026-09-17 at ~0.06 MB each,
# workerd climbing 137 MB to 3.1 GB over ~50,000 requests - and it stops
# answering near the top of that climb, which is what turned "every spec after
# minute 21 failed" into ERR_CONNECTION_REFUSED reading as test failures. That
# leak is upstream and not ours to fix. Sharding was always the mitigation:
# no server lives long enough to get there. Now each shard also gets its own
# RUNNER, so a server starts on a clean machine rather than the third one
# inheriting whatever the first two left behind.
#
# WEBKIT STAYS ON PULL REQUESTS. It was the last check standing because its
# three shards ran back to back; with one job per shard it costs its slowest
# shard like every other browser, so dropping it from PRs would give up Safari
# coverage before merge for no remaining gain. workflow_dispatch still runs a
# chosen set on demand.

on:
  # Run a chosen set on demand, e.g. one browser while collecting evidence
  # about the dev server.
  workflow_dispatch:
    inputs:
      projects:
        description: 'JSON array of {project, browser, shards} to run'
        default: '[{"project":"webkit","browser":"webkit","shards":3}]'
  push:
    branches: [main, dev]
    paths:
      - 'apps/tools/**'
      - '.github/workflows/tools-test.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/tools/**'
      - '.github/workflows/tools-test.yml'

defaults:
  run:
    working-directory: apps/tools

jobs:
  # Which (project, shard) pairs to run, expanded into one entry per job.
  #
  # A separate job rather than an expression on the matrix itself, because the
  # shard fan-out has to be computed and a matrix `include` cannot loop. It
  # costs a few seconds on a shared runner and keeps the decision in one place
  # where it can be read.
  plan:
    runs-on: ubuntu-latest
    # The workflow-level default is apps/tools, and this job never checks the
    # repo out, so that directory does not exist on its runner. Without this
    # every step here dies before it runs with "No such file or directory",
    # which is what happened on the first push of this file.
    defaults:
      run:
        working-directory: .
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      webkit: ${{ steps.build.outputs.webkit }}
    steps:
      - id: build
        env:
          # A manual run names its own list. Otherwise the event decides.
          REQUESTED: ${{ github.event.inputs.projects }}
        run: |
          node <<'JS' >> "$GITHUB_OUTPUT"
          const requested = process.env.REQUESTED;

          /* `browser` is carried alongside `project` because the two stopped
             being the same word. `touch` is the iPhone 13 profile, which
             Playwright drives with webkit, and `playwright install touch` is not
             a thing.

             touch is a shard rather than a browser: playwright.config.js gives
             it testMatch, so it runs the one touch spec and the three desktop
             projects skip that file. It costs seconds, not the 17 to 25 minutes
             the others take. Leaving it out would ship a spec file that never
             ran anywhere, which is the failure this whole workflow exists to
             stop. */
          const ALL = [
            { project: 'chromium', browser: 'chromium', shards: 3 },
            { project: 'firefox',  browser: 'firefox',  shards: 3 },
            { project: 'webkit',   browser: 'webkit',   shards: 3 },
            { project: 'touch',    browser: 'webkit',   shards: 1 },
          ];

          /* A dispatch input is outside text, and its fields reach `run:`
             lines through ${{ matrix.* }}. So only a known project is taken,
             always with its own browser, and shards are clamped to 1..8. An
             unknown name is dropped rather than fanned out into jobs that run
             nothing. An input that leaves nothing gives an empty matrix, and
             `suite` then fails because e2e did not succeed. */
          const known = new Map(ALL.map((p) => [p.project, p]));
          const chosen = requested
            ? JSON.parse(requested).flatMap((p) => {
                const base = known.get(p && p.project);
                if (!base) return [];
                const shards = Number(p.shards) || base.shards;
                return [{ ...base, shards: Math.min(Math.max(1, Math.floor(shards)), 8) }];
              })
            : ALL;

          // One entry per job. The shard number rides along so the run step,
          // the report directory and the artefact name can all use it.
          const include = chosen.flatMap((p) =>
            Array.from({ length: p.shards }, (_, i) => ({
              ...p, shard: i + 1,
            })));

          console.log('matrix=' + JSON.stringify({ include }));
          console.log('webkit=' + String(chosen.some((p) => p.project === 'webkit')));
          JS

      - name: Say what will run
        run: |
          echo "jobs: $(echo '${{ steps.build.outputs.matrix }}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).include.length))')"
          echo "webkit included: ${{ steps.build.outputs.webkit }}"

  e2e:
    needs: plan
    runs-on: ubuntu-latest
    name: Tools E2E (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    # 30 RATHER THAN 70, BECAUSE A JOB IS NOW ONE SHARD, NOT THREE.
    #
    # The history is worth keeping, because this number has been raised twice by
    # someone reading a cancelled job as a test failure. On 2026-09-02 firefox
    # was cancelled at exactly 30:00 with nothing failed, when the cap covered
    # three sequential shards. On 2026-09-20 webkit was cancelled at 45:17
    # having failed NOTHING: shard 1 passed 421 tests in 15.1m, shard 2 passed
    # 420 in 14.0m, and shard 3 was a minute from the end. Both times the cap
    # was raised.
    #
    # Those numbers are also the evidence for this one. The cap covers the
    # whole JOB, which now pays checkout, npm ci and playwright install before
    # the first test. The slowest job measured with one job per shard was
    # webkit 3/3 at 21 minutes end to end (run 36291689338), so 30 is about
    # nine minutes of margin on a job, not on a shard's tests alone. If a shard is ever cancelled at
    # exactly 30:00 with nothing red, that is this cap and not the code - split
    # to four shards before raising it, since the suite grows most weeks.
    timeout-minutes: 30
    strategy:
      # One shard failing must not cancel the others - knowing whether a failure
      # is browser-specific, or confined to one shard, is most of the diagnosis.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20. voice-write-path.spec.js drives the real profile-api
          # schema through apps/profile-api/test/helpers/d1-sqlite.js, which
          # imports node:sqlite. That module does not exist in Node 20 at all,
          # so every shard died at import time with "No such built-in module:
          # node:sqlite" before a single test ran - three red browser jobs that
          # said nothing about the code. 22 has it, behind an experimental
          # warning and no flag, and it is what profile-api-test.yml already
          # uses.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/tools/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only the browser this shard actually needs. See the plan job for why
      # this is `browser` and not `project`.
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # This is what turned "every spec after minute 21 failed" into a named
      # cause, and it stays even though one shard per job makes the climb much
      # shorter: the server's death leaves no message of its own, so without a
      # sample of memory, its processes and the socket there is nothing to read
      # afterwards. Costs a few kB and one shell.
      - name: Start resource sampler
        run: |
          cat > "$RUNNER_TEMP/sample.sh" <<'SH'
          while true; do
            printf '%s mem_avail_mb=%s ' "$(date -u +%H:%M:%S)" "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)"
            printf 'listening=%s ' "$(ss -ltn 2>/dev/null | grep -c ':8789')"
            ps -eo rss=,comm= | awk '/workerd|wrangler|node/ {rss[$2]+=$1} END {for (c in rss) printf "%s=%dMB ", c, rss[c]/1024}'
            printf '\n'
            sleep 5
          done
          SH
          chmod +x "$RUNNER_TEMP/sample.sh"
          nohup bash "$RUNNER_TEMP/sample.sh" > "$RUNNER_TEMP/resources.log" 2>&1 &
          echo "sampler pid $!"

      - name: Run E2E tests
        # ONE SHARD, ONE SERVER, ONE RUNNER. `wrangler pages dev` leaks per
        # request (~0.06 MB each, workerd 137 MB -> 3.1 GB over ~50,000
        # requests) and stops answering near the top of that climb. Sharding was
        # always the mitigation rather than a speed trick: no server lives long
        # enough to get there. Measured with three sequential shards on run
        # 35286988727, workerd sawtoothed to 1831 MB and reset at each boundary,
        # against ~3.1 GB where it died.
        #
        # Now the boundary is a job boundary, so the server also starts on a
        # clean machine. The peak should be at or below that same 1831 MB with
        # more headroom, and the sampler above is what will say so.
        #
        # Shards split by FILE and are deterministic, so a failure names the
        # same shard on a re-run. touch is one file, hence shards: 1.
        #
        # No port override is needed: playwright.config.js already sets
        # `reuseExistingServer: !process.env.CI`, so a CI run always starts its
        # own wrangler rather than adopting whatever else answers on 8789.
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        run: |
          npx playwright test \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/${{ matrix.shards }}

      # Kernel messages name an OOM kill; the sampler shows the run-up to it.
      - name: Collect server death evidence
        if: always()
        run: |
          sudo dmesg -T 2>/dev/null | tail -120 > "$RUNNER_TEMP/dmesg.log" || echo "dmesg unavailable" > "$RUNNER_TEMP/dmesg.log"
          echo "--- last 40 sampler lines ---"
          tail -40 "$RUNNER_TEMP/resources.log" || true
          echo "--- oom/kill lines in dmesg ---"
          grep -iE 'killed process|out of memory|oom' "$RUNNER_TEMP/dmesg.log" || echo "none"

      - name: Upload server death evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The shard is in the name now: upload-artifact v4 rejects duplicate
          # names, and (project, shard) pairs are separate jobs.
          name: server-evidence-tools-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/resources.log
            ${{ runner.temp }}/dmesg.log
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Must not collide across shards, nor with the games workflow's.
          name: playwright-report-tools-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/tools/playwright-report/
          retention-days: 14

  # One status to look at, and one thing a branch protection rule could require
  # later. Without it, "did the suite pass" means reading ten job results, and a
  # skipped or cancelled job is easy to misread as a pass.
  suite:
    needs: [plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    name: Tools E2E (suite)
    # Same reason as plan: no checkout here, so apps/tools does not exist.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report
        run: |
          echo "e2e result: ${{ needs.e2e.result }}"
          echo "webkit included: ${{ needs.plan.outputs.webkit }}"
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Tools E2E did not pass (${{ needs.e2e.result }})."
            exit 1
          fi
