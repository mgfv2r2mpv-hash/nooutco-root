name: Tools E2E Tests

# Mirrors games-test.yml. It exists because apps/tools had no CI at all: the
# suite was written, committed and shipped to production without ever running on
# a push. That was found while promoting dev to main - three commits' worth of
# SAP note-drafter work (structured output, malformed-JSON recovery, the admin
# ?schema=off toggle) reached production having only ever been run by hand.
#
# Sharded by browser for the same reason the games suite is: each project gets
# its own short-lived `wrangler pages dev` rather than one process that has to
# survive the whole matrix, and a failure in one engine does not hide the others.
#
# Note this suite is CDN-dependent in a way the games one is not - the note
# pages pull React and Babel from a CDN and compile JSX in the browser, which is
# why playwright.config.js caps workers at 2 and sets a 90s timeout. A CDN
# hiccup can therefore fail this workflow without anything being wrong with the
# code; check the failure before believing it.

on:
  # Run one browser on demand. The dev server has died mid-run on every red run
  # since 2026-09-16, taking every later spec with it as ERR_CONNECTION_REFUSED,
  # and it reproduces on no Mac, so the evidence has to be collected here.
  workflow_dispatch:
    inputs:
      projects:
        description: 'JSON array of {project, browser, shards} to run'
        default: '[{"project":"chromium","browser":"chromium","shards":3}]'
  push:
    branches: [main, dev]
    paths:
      - 'apps/tools/**'
      - '.github/workflows/tools-test.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/tools/**'
      - '.github/workflows/tools-test.yml'

defaults:
  run:
    working-directory: apps/tools

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Tools E2E (${{ matrix.project }})
    # 45 RATHER THAN 30, AND THE 30 WAS NOT A FLAKE. On 2026-09-02 the firefox
    # shard of run 33624526400 was cancelled by this cap at exactly 30:00, with
    # no test failure in the log. Its two siblings on the same commit finished
    # at 17:04 (chromium) and 24:57 (webkit), so the cap had roughly five
    # minutes of headroom for the second-slowest engine and none at all for the
    # slowest. The suite is 924 tests and grows most weeks.
    #
    # Raised rather than parallelised on purpose. `workers: 2` in
    # playwright.config.js is a deliberate cap - every page compiles JSX in the
    # browser and that CPU is shared with the Pages dev server - so buying time
    # by widening it would buy flakes instead.
    timeout-minutes: 45
    strategy:
      # One browser failing must not cancel the other two - knowing whether a
      # failure is browser-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # `browser` is carried alongside `project` because the two stopped being
        # the same word. `touch` is the iPhone 13 profile, which Playwright
        # drives with webkit, and `playwright install touch` is not a thing.
        # Every other step still keys off `project`, so the job names and the
        # artefact names read the way they always did.
        #
        # touch is a shard rather than a browser: playwright.config.js gives it
        # testMatch, so it runs the one touch spec and the three desktop
        # projects skip that file. It costs seconds, not the 17 to 25 minutes
        # the others take. Leaving it out of this list would have shipped a spec
        # file that never ran anywhere, which is the failure this whole workflow
        # exists to stop.
        # A manual run may name its own list; a push always runs all four.
        include: ${{ fromJSON(github.event.inputs.projects || '[{"project":"chromium","browser":"chromium","shards":3},{"project":"firefox","browser":"firefox","shards":3},{"project":"webkit","browser":"webkit","shards":3},{"project":"touch","browser":"webkit","shards":1}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/tools/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only the browser this shard actually needs. See the matrix above for
      # why this is `browser` and not `project`.
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # This is what turned "every spec after minute 21 failed" into a named
      # cause, and it stays: the server's death leaves no message of its own, so
      # without a sample of memory, its processes and the socket there is nothing
      # to read afterwards. It also watches the headroom the fix depends on -
      # measured 2026-09-17 with three shards, workerd peaks at 1831 MB and the
      # server stopped answering at ~3.1 GB, so a suite that grows needs a fourth
      # shard before it needs anything cleverer. Costs a few kB and one shell.
      - name: Start resource sampler
        run: |
          cat > "$RUNNER_TEMP/sample.sh" <<'SH'
          while true; do
            printf '%s mem_avail_mb=%s ' "$(date -u +%H:%M:%S)" "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)"
            printf 'listening=%s ' "$(ss -ltn 2>/dev/null | grep -c ':8789')"
            ps -eo rss=,comm= | awk '/workerd|wrangler|node/ {rss[$2]+=$1} END {for (c in rss) printf "%s=%dMB ", c, rss[c]/1024}'
            printf '\n'
            sleep 5
          done
          SH
          chmod +x "$RUNNER_TEMP/sample.sh"
          nohup bash "$RUNNER_TEMP/sample.sh" > "$RUNNER_TEMP/resources.log" 2>&1 &
          echo "sampler pid $!"

      - name: Run E2E tests
        # SHARDED SO THE DEV SERVER IS REPLACED THREE TIMES, not for speed - the
        # shards run one after another in this one job and cost what one run
        # cost. `wrangler pages dev` leaks per request (measured on the runner
        # 2026-09-17: ~0.06 MB each, workerd 137 MB -> 3.1 GB over ~50,000
        # requests), and it stops answering near the top of that climb: every
        # spec after the 21st minute failed ERR_CONNECTION_REFUSED and read as a
        # test failure. Playwright cannot restart a web server mid-run, so each
        # shard gets a fresh one and none lives long enough to get there.
        # MEASURED with three shards on run 35286988727: workerd sawtooths to a
        # 1831 MB peak and resets at each boundary, against ~3.1 GB where it
        # died. Green, with about 1.3 GB of headroom rather than a wide margin.
        #
        # Shards split by FILE and are deterministic, so a failure names the
        # same shard on a re-run. touch is one file, hence shards: 1.
        #
        # No port override is needed here: playwright.config.js already sets
        # `reuseExistingServer: !process.env.CI`, so a CI run always starts its
        # own wrangler rather than adopting whatever else answers on 8789.
        run: |
          failed=0
          for shard in $(seq 1 ${{ matrix.shards }}); do
            echo "::group::shard $shard of ${{ matrix.shards }}"
            # A per-shard report directory, or each shard would overwrite the last.
            PLAYWRIGHT_HTML_REPORT="playwright-report/shard-$shard" \
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/shard-$shard" \
              npx playwright test --project=${{ matrix.project }} \
              --shard=$shard/${{ matrix.shards }} || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # Kernel messages name an OOM kill; the sampler shows the run-up to it.
      - name: Collect server death evidence
        if: always()
        run: |
          sudo dmesg -T 2>/dev/null | tail -120 > "$RUNNER_TEMP/dmesg.log" || echo "dmesg unavailable" > "$RUNNER_TEMP/dmesg.log"
          echo "--- last 40 sampler lines ---"
          tail -40 "$RUNNER_TEMP/resources.log" || true
          echo "--- oom/kill lines in dmesg ---"
          grep -iE 'killed process|out of memory|oom' "$RUNNER_TEMP/dmesg.log" || echo "none"

      - name: Upload server death evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-evidence-tools-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/resources.log
            ${{ runner.temp }}/dmesg.log
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact v4 rejects duplicate names across matrix jobs, and
          # these must not collide with the games workflow's artefacts either.
          name: playwright-report-tools-${{ matrix.project }}
          path: apps/tools/playwright-report/
          retention-days: 14

  aggregate:
    # One stable check name regardless of how the matrix is shaped. Distinct
    # from the games workflow's aggregate so both can be required independently.
    name: Tools E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Report shard results
        working-directory: .
        run: |
          echo "shard result: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] || {
            echo "::error::One or more browser shards failed - see the Tools E2E (<browser>) jobs."
            exit 1
          }
